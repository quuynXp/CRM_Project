_format_version: "3.0"

services:
  # ==============================================================================
  # AUTH SERVICE (Port 10001)
  # ==============================================================================
  - name: auth-service
    url: http://auth-service:10001
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE

  # ==============================================================================
  # CUSTOMER SERVICE (Port 10002)
  # ==============================================================================
  - name: customer-service
    url: http://customer-service:10002
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: customer-routes
        paths:
          - /api/v1/customers
          - /api/v1/leads
        strip_path: false

  # ==============================================================================
  # SALES SERVICE (Port 10003)
  # ==============================================================================
  - name: sales-service
    url: http://sales-service:10003
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: sales-routes
        paths:
          - /api/v1/sales
          - /api/v1/orders
          - /api/v1/transactions
        strip_path: false

  # ==============================================================================
  # NOTIFICATION SERVICE (Port 10004)
  # ==============================================================================
  - name: notification-service
    url: http://notification-service:10004
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false

  # ==============================================================================
  # AI SERVICE (Port 8001 - Python)
  # ==============================================================================
  - name: ai-service
    url: http://ai-service:8001
    connect_timeout: 600000
    write_timeout: 600000
    read_timeout: 600000
    routes:
      - name: ai-routes
        paths:
          - /api/v1/ai
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
