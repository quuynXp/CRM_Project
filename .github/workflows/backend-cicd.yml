name: Backend Microservices - Build & Deploy

on:
  push:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - "infrastructure/**"
      - "proto/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Thay username github của bạn vào đây (viết thường)
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ============================================================================
  # JOB 1: BUILD & PUSH DOCKER IMAGES (PARALLEL MATRIX)
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        service: 
          - auth-service
          - customer-service
          - sales-service
          - notification-service
          - ai-service

    steps:
      - name: 🧱 Checkout Source Code
        uses: actions/checkout@v4

      # 1. Kiểm tra xem service này có thay đổi code không?
      - name: 🔍 Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            src:
              - 'backend/${{ matrix.service }}/**'
              - 'proto/**'
              - 'infrastructure/**'

      # 2. Login vào GitHub Container Registry
      - name: 🔐 Log in to the Container registry
        if: steps.changes.outputs.src == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Setup Docker Buildx (để cache layer build nhanh hơn)
      - name: 🐳 Set up Docker Buildx
        if: steps.changes.outputs.src == 'true'
        uses: docker/setup-buildx-action@v3

      # 4. Build và Push Image
      - name: 🔨 Build and push Docker image
        if: steps.changes.outputs.src == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          # Dockerfile tự handle việc mvn package hoặc pip install
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/crm-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/crm-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 2: DEPLOY TO SERVER (VIA SSH)
  # ============================================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' # Chỉ deploy khi merge vào master
    
    steps:
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🔥 Starting Deployment..."
            
            # 1. Di chuyển vào thư mục dự án trên Server
            cd /opt/crm-microservices || exit

            # 2. Login vào GHCR trên Server để pull image mới (cần setup trước 1 lần)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Pull code mới nhất (Docker Compose file)
            git pull origin master

            # 4. Pull Images mới nhất từ Registry
            docker-compose pull

            # 5. Restart các container (Zero downtime nếu config healthcheck tốt, ở đây là restart nhanh)
            docker-compose up -d --remove-orphans

            # 6. Dọn dẹp images cũ cho nhẹ máy
            docker image prune -f

            echo "✅ Deployment Successful!"